# USB-PD (36 V / 180 W EPR) controller for a two-channel LED matrix wall.
#
# Declaring rail voltages is what lets the ERC check pins against their
# absolute maximum ratings. On this board that check is not decoration: the
# HUSB238A's VBUS pin is rated 29.4 V recommended / 33 V absolute against a
# 36 V bus, and the INA226 is a 36 V part on the same bus. Both are handled
# by topology rather than by part rating, and P1 is what proves the handling
# is actually wired.
name: led-matrix-controller
description: >-
  36 V / 180 W USB-PD sink driving two LED-matrix channels through TPS16630
  eFuses, with Ethernet and a differential data link.

rails:
  GND:
    type: ground

  # The PD bus. 36 V nominal; a compliant fixed PDO may sit at +5%, so
  # every margin in this design is worked against 37.8 V.
  VBUS:
    voltage: 36.0
    # Every margin in this design is worked against the +5% a compliant fixed
    # PDO may sit at, so the overvoltage check has to see it too. Declaring only
    # the nominal would pass a pin that the tolerance breaks.
    voltageMax: 37.8

  # Channel outputs, downstream of the TPS16630 eFuses. Same voltage as the
  # bus; separate nets so a short on one chain is visibly one chain.
  CH1_36V:
    voltage: 36.0
    voltageMax: 37.8
  CH2_36V:
    voltage: 36.0
    voltageMax: 37.8

  # Rails. The 5 V stage runs in near-100% duty pass-through at vSafe5V, so
  # it is 4.56 V at the bottom of the USB-C tolerance - see the dropout
  # table. 5.0 V is the nominal declared here; the sag is a documented
  # limit rather than something the ERC can model.
  BUS_5V:
    voltage: 5.0
    # The worst case, not the nominal, and the difference decides a real check:
    # in pass-through at the bottom of vSafe5V this rail is 4.56 V typical and
    # 4.48 V at the converter's applicable worst-case on-resistance. The p.5
    # 190 mOhm maximum is specified at BOOT-SW = 6 V; this design runs at low
    # dropout, where Figure 1's 3 V curve applies and the maximum is unpublished
    # - about 0.24 Ohm at the curve's 1.25-1.30x ratio. 4.48 V is UNDER the
    # 74AHCT541's 4.5 V floor, so P1-undervoltage will fire here on purpose. See
    # Assumptions; the consequence is cosmetic and documented.
    voltageMin: 4.48
  BUS_3V3:
    voltage: 3.3

  # The HUSB238A's VBUS pin sits behind the Figure 6 follower - an MMBT5551
  # emitter follower here, not the vendor's BSS138 - which holds it near 26.3 V
  # on a 36 V bus - set by the BZT52C27 gate clamp. It was
  # 18.5 V with a 20 V clamp, which is below the part's vVBUV_F2 disconnect
  # threshold of 22.4 V and would have dropped every 36 V contract. Declaring it as its own rail is what
  # stops P1 reading the 36 V bus straight onto a 33 V-absolute pin - the
  # follower is the whole reason that pin survives.
  PD_VBUS_SENSE:
    voltage: 26.3
    # The Zener's high corner (28.35 V) less the follower's low V_BE (0.6 V).
    voltageMax: 27.75

  # The module return. NOT GND: R1, the 10 mOhm shunt, sits between them, and a
  # netlist that calls J2/J3 pin 2 GND shorts the shunt through the ground pour
  # and the current sense reads zero. The two nets meet at the shunt and nowhere
  # else. No ERC rule catches a connector wired to the wrong net, so the name is
  # the whole defence.
  LED_RTN:
    type: ground

buses:
  - type: i2c
    sda: I2C_SDA
    scl: I2C_SCL

# Suppress a rule here, with a comment saying why, rather than working
# around it in the netlist.
# Scope each entry as `rule@where` unless it genuinely applies board-wide. A
# bare id is how a working check quietly stops working.
ignore:
  # The HUSB238A's VBUS pin is a sense input behind the Figure 6 follower, not
  # a supply. The chip's actual supply is VDD, tied to 3V3 and decoupled with
  # C18 (1 uF, datasheet-mandated) and C19 (100 nF). P2 fires because the kb
  # types pin 16 power_in - which is true, it CAN power the chip when VDD is
  # absent, and here VDD is not absent.
  #
  # Fitting a capacitor to satisfy the rule would make the board worse. The
  # node's only discharge path is the pin's own 330 uA draw, so 100 nF would
  # delay the undervoltage detector by about 1.2 ms crossing vVBUV_F2 - and
  # UVP is the one protection mechanism the clamp topology preserves above
  # 28 V. Scoped to this rail: P2 still guards BUS_5V and BUS_3V3.
  - P2-no-decoupling@PD_VBUS_SENSE

  # TP1/TP2 are bare pads for the UART0 console, not components - a footprint
  # with no LCSC part, so the importer cannot place them and the net has one
  # pin until they are drawn by hand. Named rather than dropped so the import
  # carries a net to attach the pad to; see 'Hand-drawn after import'.
  - C1-single-pin-net@UART_TX
  - C1-single-pin-net@UART_RX
