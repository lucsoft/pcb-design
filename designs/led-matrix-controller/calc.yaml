    value: 1
    unit: kohm
    source: "chosen: lets the FAULT transistor override a driven-high GPIO"
    provenance: chosen
  I_SHDN_SOURCE:
    value: 10
    unit: uA
    source: "TPS16630 SHDN pin internal source, <=10 uA"
    provenance: datasheet
  V_SHDN_THRESHOLD:
    value: 0.8
    unit: V
    source: "TPS16630 guaranteed-shutdown threshold"
    provenance: datasheet
  V_SHUTR:
    value: 2
    unit: V
    source: "TPS16630 V(SHUTR), the turn-on threshold"
    provenance: datasheet
  R_DS_EFUSE_85C_MAX:
    value: 45
    unit: mohm
    source: "TPS16630 p.7, integrated FET at T_J = 85 C, max (the 85 C row has no typ column)"
    provenance: datasheet

derived:

  # ---- budget ---------------------------------------------------------

  p_budget:
    expr: V_BUS * I_CONTRACT
    unit: W
    display: { unit: W, digits: 3 }
  p_modules:
    expr: p_budget - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
  p_gpio_mode:
    expr: V_GPIO_MODE * I_GPIO_MODE
    unit: W
    display: { unit: W, digits: 2 }
  v_bus_max:
    expr: V_BUS * (1 + PDO_TOLERANCE)
    unit: V
    display: { unit: V, digits: 3 }
  v_bus_min:
    expr: V_BUS * (1 - PDO_TOLERANCE)
    unit: V
    display: { unit: V, digits: 3 }

  p_modules_48v:
    expr: P_BUDGET_48V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
    uncited: true
  conn_share_balanced:
    expr: i_channel_balanced / CONN_RATING
    unit: ""
    display: { unit: "%", digits: 2 }
  conn_share_worst:
    expr: i_channel_worst / CONN_RATING
    unit: ""
    display: { unit: "%", digits: 2 }
  conn_margin:
    expr: CONN_RATING / i_channel_worst
    unit: ""
    display: { unit: "x", digits: 2 }

  # ---- brightness and frame rate --------------------------------------

  modules_per_channel:
    expr: N_MODULES / N_CHANNELS
    unit: ""
    display: { unit: "", digits: 2 }
  brightness_10:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (10 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_14:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (14 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_20:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (N_MODULES * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_24:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (24 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_10:
    expr: brightness_10 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_14:
    expr: brightness_14 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_20:
    expr: brightness_20 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_24:
    expr: brightness_24 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  fps_at_5:
    expr: 1 / (5 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 3 }
  fps_at_7:
    expr: 1 / (7 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 3 }
  fps_design:
    expr: 1 / (modules_per_channel * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_12:
    expr: 1 / (12 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_15:
    expr: 1 / (15 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_20:
    expr: 1 / (20 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }

  # the 140 W / 28 V alternative, for Why not 28 V
  p_modules_28v:
    expr: P_BUDGET_28V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
    uncited: true
  brightness_14_at_28v:
    expr: min(CAP_THERMAL, p_modules_28v * ETA_MODULE / (14 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_14_at_28v:
    expr: brightness_14_at_28v ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_20_at_28v:
    expr: min(CAP_THERMAL, p_modules_28v * ETA_MODULE / (N_MODULES * MODULE_FULL_W)) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- current --------------------------------------------------------

  i_module_full:
    expr: MODULE_FULL_W / V_MODULE_RAIL
    unit: A
    display: { unit: A, digits: 3 }
  i_wall_full_5v:
    expr: N_MODULES * i_module_full
    unit: A
    display: { unit: A, digits: 3 }
  p_wall_full:
    expr: N_MODULES * MODULE_FULL_W
    unit: W
    display: { unit: W, digits: 3 }
  limiter_divisor:
    expr: V_BUS * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_20V:
    expr: V_PDO_20 * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_12V:
    expr: V_PDO_12 * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_error_12V:
    expr: limiter_divisor / limiter_divisor_12V
    unit: ""
    display: { unit: "x", digits: 2 }
  limiter_divisor_wrong:
    expr: V_BUS / V_MODULE_RAIL / ETA_MODULE
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_underprediction:
    expr: 1 - limiter_divisor / limiter_divisor_wrong
    unit: ""
    display: { unit: "%", digits: 2 }
  i_bus_full_white:
    expr: i_wall_full_5v / limiter_divisor
    unit: A
    display: { unit: A, digits: 2 }
  i_channel_flash:
    expr: i_bus_full_white / N_CHANNELS
    unit: A
    display: { unit: A, digits: 2 }
  i_channel_balanced:
    expr: i_channel_flash * brightness_20
    unit: A
    display: { unit: A, digits: 3 }
  i_channel_worst:
    expr: i_channel_flash * CAP_THERMAL
    unit: A
    display: { unit: A, digits: 3 }
  i_channel_balanced_margin:
    expr: 1 - i_channel_balanced / i_channel_worst
    unit: ""
    display: { unit: "%", digits: 2 }

  n_ics:
    expr: N_MODULES * LEDS_PER_MODULE
    unit: ""
    display: { unit: "", digits: 3 }
  i_quiescent_lo:
    expr: n_ics * I_Q_PER_IC_LO
    unit: A
    display: { unit: A, digits: 2 }
  i_quiescent_hi:
    expr: n_ics * I_Q_PER_IC_HI
    unit: A
    display: { unit: A, digits: 2 }
  p_quiescent_lo:
    expr: i_quiescent_lo * V_MODULE_RAIL / ETA_MODULE
    unit: W
    display: { unit: W, digits: 2 }
  p_quiescent_hi:
    expr: i_quiescent_hi * V_MODULE_RAIL / ETA_MODULE
    unit: W
    display: { unit: W, digits: 2 }
  quiescent_share_lo:
    expr: p_quiescent_lo / p_budget
    unit: ""
    display: { unit: "%", digits: 2 }
  quiescent_share_hi:
    expr: p_quiescent_hi / p_budget
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- cable ----------------------------------------------------------

  r_cable_ref:
    expr: 2 * RHO_CU * L_REF / CSA_REF
    unit: ohm
    display: { unit: Ω, digits: 3 }
  v_drop_ref:
    expr: i_channel_worst * r_cable_ref
    unit: V
    display: { unit: V, digits: 3 }
  p_cable_balanced:
    expr: i_channel_balanced ** 2 * r_cable_ref
    unit: W
    display: { unit: W, digits: 3 }
  p_cable_worst:
    expr: i_channel_worst ** 2 * r_cable_ref
    unit: W
    display: { unit: W, digits: 3 }
  p_cable_total:
    expr: N_CHANNELS * p_cable_balanced
    unit: W
    display: { unit: W, digits: 2 }
  i_contract_with_cable:
    expr: (p_budget + p_cable_total) / V_BUS
    unit: A
    display: { unit: A, digits: 2 }
  v_drop_allowed:
    expr: DROP_BUDGET * V_BUS
    unit: V
    display: { unit: V, digits: 2 }
  l_max_worst:
    expr: v_drop_allowed * CSA_REF / (2 * RHO_CU * i_channel_worst)
    unit: m
    display: { unit: m, digits: 2 }
  l_max_balanced:
    expr: v_drop_allowed * CSA_REF / (2 * RHO_CU * i_channel_balanced)
    unit: m
    display: { unit: m, digits: 3 }
  l_max_alt:
    expr: v_drop_allowed * CSA_ALT / (2 * RHO_CU * i_channel_worst)
    unit: m
    display: { unit: m, digits: 3 }
  v_module_headroom:
    expr: V_BUS - V_MODULE_IN_MIN
    unit: V
    display: { unit: V, digits: 3 }

  # ---- the PWM ripple divider -----------------------------------------

  c_channel_bank:
    expr: modules_per_channel * C_MODULE_BULK
    unit: F
    display: { unit: mF, digits: 2 }
  z_bank:
    expr: 1 / (2 * pi * F_PWM * c_channel_bank)
    unit: ohm
    display: { unit: Ω, digits: 3 }
  bus_share_short:
    expr: z_bank / sqrt(R_LOOP_SHORT ** 2 + z_bank ** 2)
    unit: ""
    display: { unit: "%", digits: 3 }
  bus_share_ref:
    expr: z_bank / sqrt(R_LOOP_REF ** 2 + z_bank ** 2)
    unit: ""
    display: { unit: "%", digits: 3 }
  ripple_up_short:
    expr: (i_channel_flash - i_channel_balanced) * bus_share_short
    unit: A
    display: { unit: A, digits: 2 }
  ripple_down_short:
    expr: -i_channel_balanced * bus_share_short
    unit: A
    display: { unit: A, digits: 2 }
  ripple_up_ref:
    expr: (i_channel_flash - i_channel_balanced) * bus_share_ref
    unit: A
    display: { unit: A, digits: 2 }
  ripple_down_ref:
    expr: -i_channel_balanced * bus_share_ref
    unit: A
    display: { unit: A, digits: 2 }

  t_pwm_period:
    expr: 1 / F_PWM
    unit: s
    display: { unit: ms, digits: 2 }
  drop_share_5v:
    expr: V_DROP_EXAMPLE / V_MODULE_RAIL
    unit: ""
    display: { unit: "%", digits: 2 }
  drop_share_36v:
    expr: V_DROP_EXAMPLE / V_BUS
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- the 5 V rail ----------------------------------------------------
  #
  # TPS54360B datasheet p.12 Eq. 1, inverted:
  #   V_OUT = 0.99 V_IN + 0.99 V_F - 0.99 R_DS I_OUT - V_F - R_dc I_OUT
  # capped at the regulated 5.0 V, which is what the rail does once the input
  # rises far enough to leave pass-through.

  r_ds_applicable_lo:
    expr: R_DS_6V_MAX * R_DS_RATIO_LO
    unit: ohm
    display: { unit: ohm, digits: 3 }
    uncited: true
  r_ds_applicable_hi:
    expr: R_DS_6V_MAX * R_DS_RATIO_HI
    unit: ohm
    display: { unit: ohm, digits: 3 }
    uncited: true
  r_ds_applicable_check:
    expr: R_DS_APPLICABLE
    unit: ohm
    display: { unit: ohm, digits: 2 }
    limit: { min: r_ds_applicable_lo, max: r_ds_applicable_hi,
             why: "the working value has to stay inside the band Figure 1's ratio gives" }
    uncited: true

  v_rail5_typ_lo:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_typ_nom:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_NOM - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 3 }
  v_rail5_6v_max:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_6V_MAX + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_applicable:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_APPLICABLE + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_alt_dcr:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_ALT) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 3 }
  r_ds_at_buffer_floor:
    expr: (0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - V_BUFFER_MIN - R_DCR_L1 * I_RAIL5) / (0.99 * I_RAIL5)
    unit: ohm
    display: { unit: ohm, digits: 3 }
  margin_buffer_typ:
    expr: v_rail5_typ_lo - V_BUFFER_MIN
    unit: V
    display: { unit: V, digits: 2 }
  margin_buffer_applicable:
    expr: v_rail5_applicable - V_BUFFER_MIN
    unit: V
    display: { unit: mV, digits: 2 }

  # ---- what D14 holds the VBUS pin at ----------------------------------

  shortfall_buffer_applicable:
    expr: V_BUFFER_MIN - v_rail5_applicable
    unit: V
    display: { unit: mV, digits: 2 }
  shortfall_uv_f0:
    expr: uv_bound_f0 - v_pin_applicable
    unit: V
    display: { unit: V, digits: 2 }

  v_pin_typ:
    expr: v_rail5_typ_lo - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  v_pin_applicable:
    expr: v_rail5_applicable - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  v_pin_6v_max:
    expr: v_rail5_6v_max - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  margin_pin_min:
    expr: v_pin_typ - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 3 }
  margin_vbprs_typ_at_applicable:
    expr: v_pin_applicable - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_max_at_applicable:
    expr: v_pin_applicable - V_VBPRS_R_MAX
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_typ_at_typ:
    expr: v_pin_typ - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_max_at_typ:
    expr: v_pin_typ - V_VBPRS_R_MAX
    unit: V
    display: { unit: V, digits: 2 }
  uv_bound_f1:
    expr: UV_BAND_F1 * V_VSAFE5V_NOM
    unit: V
    display: { unit: V, digits: 3 }
  uv_bound_f0:
    expr: UV_BAND_F0 * V_VSAFE5V_NOM
    unit: V
    display: { unit: V, digits: 3 }
  margin_uv_f1_applicable:
    expr: v_pin_applicable - uv_bound_f1
    unit: V
    display: { unit: V, digits: 2 }
  margin_uv_f0_applicable:
    expr: v_pin_applicable - uv_bound_f0
    unit: V
    display: { unit: V, digits: 2 }
  margin_uv_f1_typ:
    expr: v_pin_typ - uv_bound_f1
    unit: V
    display: { unit: V, digits: 2 }

  # ---- logic levels ----------------------------------------------------

  vih_status_chain:
    expr: VIH_SK6812_RATIO * V_RAIL5_NOM
    unit: V
    display: { unit: V, digits: 3 }
  vih_status_at_sag:
    expr: VIH_SK6812_RATIO * v_rail5_typ_lo
    unit: V
    display: { unit: V, digits: 3 }
  voh_esp32:
    expr: VOH_ESP32_RATIO * V_RAIL3V3
    unit: V
    display: { unit: V, digits: 3 }
  logic_shortfall:
    expr: vih_status_chain - voh_esp32
    unit: V
    display: { unit: mV, digits: 3 }

  # ---- the 3.3 V rail --------------------------------------------------

  i_eth_module:
    expr: P_ETH_MODULE / V_RAIL3V3
    unit: A
    display: { unit: mA, digits: 3 }
  i_max3485_pair:
    expr: N_CHANNELS * (I_MAX3485_ICC + I_MAX3485_LINE)
    unit: A
    display: { unit: mA, digits: 2 }
  i_rail3v3:
    expr: I_ESP32_TX + i_eth_module + i_max3485_pair + I_HUSB_VDD + I_INA_AND_PULLUPS
    unit: A
    display: { unit: mA, digits: 3 }
  p_rail3v3:
    expr: i_rail3v3 * V_RAIL3V3
    unit: W
    display: { unit: W, digits: 3 }
  p_max3485_total:
    expr: i_max3485_pair * V_RAIL3V3
    unit: W
    display: { unit: mW, digits: 2 }
  p_max3485_termination:
    expr: N_CHANNELS * I_MAX3485_LINE ** 2 * R_TERM
    unit: W
    display: { unit: mW, digits: 2 }
  share_offboard:
    expr: p_max3485_termination / p_max3485_total
    unit: ""
    display: { unit: "%", digits: 2 }
  share_onboard:
    expr: 1 - share_offboard
    unit: ""
    display: { unit: "%", digits: 2 }
  p_max3485_onboard:
    expr: p_max3485_total - p_max3485_termination
    unit: W
    display: { unit: W, digits: 2 }
  p_ldo_alternative:
    expr: (v_rail5_typ_nom - V_RAIL3V3) * I_ESP32_TX
    unit: W
    display: { unit: W, digits: 1 }

  loss_cascade_draw:
    expr: p_rail3v3 * (1 / ETA_CASCADE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  loss_single_draw:
    expr: p_rail3v3 * (1 / ETA_SINGLE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  penalty_draw:
    expr: loss_cascade_draw - loss_single_draw
    unit: W
    display: { unit: mW, digits: 2 }
  loss_cascade_sized:
    expr: P_RAIL3V3_SIZED * (1 / ETA_CASCADE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  loss_single_sized:
    expr: P_RAIL3V3_SIZED * (1 / ETA_SINGLE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  penalty_sized:
    expr: loss_cascade_sized - loss_single_sized
    unit: W
    display: { unit: mW, digits: 2 }

  # ---- the follower ----------------------------------------------------
  #
  # R44 is the only path into the base, so the base sits I_B x R44 below the
  # collector and the emitter one V_BE below that. The disconnect threshold is
  # a percentage of the REQUESTED voltage, so a fixed offset is a bigger
  # fraction of a smaller contract -- which is what makes 12 V the pinch point.

  i_base:
    expr: I_VBUS_PIN_MAX / H_FE_Q3
    unit: A
    display: { unit: uA, digits: 2 }
  v_r44_drop:
    expr: i_base * R44
    unit: V
    display: { unit: mV, digits: 2 }
  pin_at_9v:
    expr: 0.95 * V_PDO_9 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  pin_at_12v:
    expr: 0.95 * V_PDO_12 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_at_15v:
    expr: 0.95 * V_PDO_15 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_at_20v:
    expr: 0.95 * V_PDO_20 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_clamped:
    expr: V_ZENER_LO - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_clamped_hi:
    expr: V_ZENER_HI - V_BE_Q3_LO
    unit: V
    display: { unit: V, digits: 4 }
  margin_9v:
    expr: pin_at_9v - UV_BAND_F1 * V_PDO_9
    unit: V
    display: { unit: V, digits: 2 }
  margin_12v:
    expr: pin_at_12v - UV_BAND_F0 * V_PDO_12
    unit: V
    display: { unit: V, digits: 2 }
  margin_15v:
    expr: pin_at_15v - UV_BAND_F0 * V_PDO_15
    unit: V
    display: { unit: V, digits: 2 }
  margin_20v:
    expr: pin_at_20v - UV_BAND_F0 * V_PDO_20
    unit: V
    display: { unit: V, digits: 2 }
  margin_clamped:
    expr: pin_clamped - V_UV_F2
    unit: V
    display: { unit: V, digits: 3 }
  margin_12v_fraction:
    expr: margin_12v / (UV_BAND_F0 * V_PDO_12)
    unit: ""
    display: { unit: "%", digits: 2 }
  margin_12v_at_hfe80:
    expr: 0.95 * V_PDO_12 - I_VBUS_PIN_MAX / H_FE_DATASHEET_MIN * R44 - V_BE_Q3 - UV_BAND_F0 * V_PDO_12
    unit: V
    display: { unit: V, digits: 2 }
  v_bus_at_uv_f2:
    expr: V_UV_F2 + V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  v_bus_ov_trip:
    expr: OV_BAND * V_BUS
    unit: V
    display: { unit: V, digits: 3 }

  # what a MOSFET follower would have needed, and what the 20 V clamp gave
  v_min_for_bss138:
    expr: V_GS_BSS138_MAX / (0.95 - UV_BAND_F0)
    unit: V
    display: { unit: V, digits: 3 }
  margin_20v_bss138:
    expr: 0.95 * V_PDO_20 - V_GS_BSS138_MAX - UV_BAND_F0 * V_PDO_20
    unit: V
    display: { unit: V, digits: 1 }
  pin_c20_nom:
    expr: V_ZENER_C20_NOM - V_GS_BSS138_TYP
    unit: V
    display: { unit: V, digits: 3 }
  pin_c20_lo:
    expr: V_ZENER_C20_LO - V_GS_BSS138_MAX
    unit: V
    display: { unit: V, digits: 3 }
  pin_c20_hi:
    expr: V_ZENER_C20_HI - V_GS_BSS138_LO
    unit: V
    display: { unit: V, digits: 3 }
  below_uv_f2_c20:
    expr: V_UV_F2 - pin_c20_nom
    unit: V
    display: { unit: V, digits: 2 }

  # ---- what the follower does at the bottom of vSafe5V -----------------

  pin_follower_lo:
    expr: V_VSAFE5V_LO - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  pin_follower_hi:
    expr: V_VSAFE5V_LO - v_r44_drop - V_BE_Q3_LO
    unit: V
    display: { unit: V, digits: 3 }
  margin_follower_vbus_min:
    expr: pin_follower_lo - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 2 }
  margin_follower_vbprs:
    expr: pin_follower_lo - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  vbus_pin_requirement_drop:
    expr: V_VBUS_PIN_MIN_NOVDD - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 3 }
  vbus_pin_current_ratio:
    expr: I_VBUS_PIN_NOVDD_MAX / I_VBUS_PIN_MAX
    unit: ""
    display: { unit: "x", digits: 2 }
  pin_at_36v_nominal:
    expr: V_ZENER_NOM - (V_BE_Q3 + V_BE_Q3_LO) / 2
    unit: V
    display: { unit: V, digits: 3 }
  v_schottky_reverse:
    expr: pin_at_36v_nominal - V_RAIL5_NOM
    unit: V
    display: { unit: V, digits: 3 }

  # ---- Q3 and R44 at the corners ---------------------------------------

  v_ce_q3_normal:
    expr: v_bus_max - pin_clamped
    unit: V
    display: { unit: V, digits: 4 }
  v_ce_q3_clamp:
    expr: V_TVS_CLAMP - pin_clamped
    unit: V
    display: { unit: V, digits: 4 }
  v_ce_bss138_ratio:
    expr: V_DS_BSS138 / v_ce_q3_clamp
    unit: ""
    display: { unit: "x", digits: 2 }
  v_across_r44_nominal:
    expr: V_BUS - V_ZENER_NOM
    unit: V
    display: { unit: V, digits: 2 }
  i_zener:
    expr: v_across_r44_nominal / R44
    unit: A
    display: { unit: mA, digits: 3 }
  p_r44_nominal:
    expr: v_across_r44_nominal ** 2 / R44
    unit: W
    display: { unit: mW, digits: 2 }
  p_r44_vendor_step:
    expr: v_across_r44_nominal ** 2 / R44_ALT_47
    unit: W
    display: { unit: mW, digits: 2 }
  derating_r44_nominal:
    expr: p_r44_nominal / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  derating_r44_vendor_step:
    expr: p_r44_vendor_step / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  v_across_r44_corner:
    expr: v_bus_max - V_ZENER_LO
    unit: V
    display: { unit: V, digits: 4 }
  p_r44_corner:
    expr: v_across_r44_corner ** 2 / R44
    unit: W
    display: { unit: mW, digits: 3 }
  derating_r44_corner:
    expr: p_r44_corner / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  v_across_r44_clamp:
    expr: V_TVS_CLAMP - V_ZENER_LO
    unit: V
    display: { unit: V, digits: 4 }
  p_r44_clamp:
    expr: v_across_r44_clamp ** 2 / R44
    unit: W
    display: { unit: mW, digits: 3 }
  derating_r44_clamp:
    expr: p_r44_clamp / P_RATING_0402
    unit: ""
    display: { unit: "x", digits: 2 }
  p_zener:
    expr: V_ZENER_NOM * i_zener
    unit: W
    display: { unit: mW, digits: 2 }
  p_q3_collector:
    expr: (V_BUS - (V_ZENER_NOM - V_BE_Q3)) * I_VBUS_PIN_MAX
    unit: W
    display: { unit: mW, digits: 2 }
  p_front_end:
    expr: p_q3_collector + p_r44_nominal + p_zener
    unit: W
    display: { unit: W, digits: 2 }

  # ---- the eFuse's programmed values -----------------------------------

  i_limit:
    expr: ILIM_PRODUCT / R_ILIM
    unit: A
    display: { unit: A, digits: 3 }
  i_limit_low_corner:
    expr: i_limit * (1 - ILIM_TOLERANCE)
    unit: A
    display: { unit: A, digits: 3 }
    uncited: true
  ilim_margin:
    expr: i_limit_low_corner / i_channel_flash
    unit: ""
    display: { unit: "x", digits: 3 }
  gain_dvdt_check:
    expr: 1 / (K_DVDT * I_DVDT_TYP)
    unit: ""
    display: { unit: "", digits: 3 }
  t_dvdt:
    expr: K_DVDT * V_BUS * C_DVDT
    unit: s
    display: { unit: ms, digits: 3 }
  t_dvdt_lo:
    expr: V_BUS * C_DVDT / (GAIN_DVDT_MAX * I_DVDT_MAX)
    unit: s
    display: { unit: ms, digits: 3 }
  t_dvdt_hi:
    expr: V_BUS * C_DVDT / (GAIN_DVDT_MIN * I_DVDT_MIN)
    unit: s
    display: { unit: ms, digits: 3 }
  i_inrush:
    expr: c_channel_bank * V_BUS / t_dvdt
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_lo:
    expr: c_channel_bank * V_BUS / t_dvdt_hi
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_hi:
    expr: c_channel_bank * V_BUS / t_dvdt_lo
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_both:
    expr: N_CHANNELS * i_inrush
    unit: A
    display: { unit: A, digits: 3 }
  inrush_share_36v:
    expr: i_inrush_both / I_CONTRACT
    unit: ""
    display: { unit: "%", digits: 2 }
  inrush_share_12v:
    expr: i_inrush_both / I_CONTRACT_12V
    unit: ""
    display: { unit: "%", digits: 2 }
  t_turn_on:
    expr: T_TURN_ON_BASE + T_TURN_ON_PER_NF * C_DVDT
    unit: s
    display: { unit: ms, digits: 3 }
  c_channel_bank_20:
    expr: 2 * c_channel_bank
    unit: F
    display: { unit: mF, digits: 2 }
  i_inrush_20:
    expr: c_channel_bank_20 * V_BUS / t_dvdt
    unit: A
    display: { unit: A, digits: 3 }

  # ---- the ramp as energy ----------------------------------------------

  energy_channel:
    expr: 0.5 * c_channel_bank * V_BUS ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ti_demo:
    expr: 0.5 * C_TI_DEMO * V_TI_DEMO ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ratio:
    expr: energy_ti_demo / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  energy_channel_20:
    expr: 0.5 * c_channel_bank_20 * V_BUS ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ratio_20:
    expr: energy_ti_demo / energy_channel_20
    unit: ""
    display: { unit: "x", digits: 2 }
  p_inrush:
    expr: 0.5 * V_BUS * i_inrush
    unit: W
    display: { unit: W, digits: 2 }
  p_inrush_both:
    expr: N_CHANNELS * p_inrush
    unit: W
    display: { unit: W, digits: 2 }
  p_inrush_lo:
    expr: 0.5 * V_BUS * i_inrush_lo
    unit: W
    display: { unit: W, digits: 3 }
  p_inrush_hi:
    expr: 0.5 * V_BUS * i_inrush_hi
    unit: W
    display: { unit: W, digits: 3 }
  energy_available_lo:
    expr: P_FIG13_TIMEOUT_LO * T_TREG_TIMEOUT
    unit: J
    display: { unit: J, digits: 2 }
  energy_available_hi:
    expr: P_FIG13_TIMEOUT_HI * T_TREG_TIMEOUT
    unit: J
    display: { unit: J, digits: 2 }
  margin_treg_lo:
    expr: energy_available_lo / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  margin_treg_hi:
    expr: energy_available_hi / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  p_fig13_85c:
    expr: E_FIG13_85C / T_TREG_TIMEOUT
    unit: W
    display: { unit: W, digits: 1 }
  margin_treg_85c:
    expr: E_FIG13_85C / energy_channel
    unit: ""
    display: { unit: "x", digits: 1 }
  margin_treg_85c_20:
    expr: E_FIG13_85C / energy_channel_20
    unit: ""
    display: { unit: "x", digits: 3 }

  # ---- the UVLO / OVP divider ------------------------------------------

  r_divider_total:
    expr: R_UV1 + R_UV2 + R_UV3
    unit: ohm
    display: { unit: kohm, digits: 4 }
    uncited: true
  uvlo_trip:
    expr: V_REF_EFUSE * r_divider_total / (R_UV2 + R_UV3)
    unit: V
    display: { unit: V, digits: 3 }
  uvlo_falling:
    expr: (V_REF_EFUSE - UVLO_HYST) * r_divider_total / (R_UV2 + R_UV3)
    unit: V
    display: { unit: V, digits: 3 }
  divider_ratio:
    expr: r_divider_total / R_UV3
    unit: ""
    display: { unit: "", digits: 3 }
  ovp_trip:
    expr: V_REF_EFUSE * divider_ratio
    unit: V
    display: { unit: V, digits: 4 }
  i_divider:
    expr: V_BUS / r_divider_total
    unit: A
    display: { unit: uA, digits: 3 }
  ratio_min:
    expr: ((R_UV1 + R_UV2) * (1 - RES_TOL) + R_UV3 * (1 + RES_TOL)) / (R_UV3 * (1 + RES_TOL))
    unit: ""
    display: { unit: "", digits: 4 }
    uncited: true
  ratio_max:
    expr: ((R_UV1 + R_UV2) * (1 + RES_TOL) + R_UV3 * (1 - RES_TOL)) / (R_UV3 * (1 - RES_TOL))
    unit: ""
    display: { unit: "", digits: 4 }
    uncited: true
  ovp_trip_lo:
    expr: V_REF_EFUSE_MIN * ratio_min
    unit: V
    display: { unit: V, digits: 3 }
  ovp_trip_hi:
    expr: V_REF_EFUSE_MAX * ratio_max
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_comparator_lo:
    expr: V_OVPF_MIN * divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_comparator_hi:
    expr: V_OVPF_MAX * divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_lo:
    expr: V_OVPF_MIN * ratio_min
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_hi:
    expr: V_OVPF_MAX * ratio_max
    unit: V
    display: { unit: V, digits: 3 }
  ovp_trip_above_bus:
    expr: ovp_trip_lo - v_bus_max
    unit: V
    display: { unit: V, digits: 2 }
  ovp_trip_below_abs:
    expr: V_MODULE_ABS_MAX - ovp_trip_hi
    unit: V
    display: { unit: V, digits: 2 }
  ovp_trip_above_operating:
    expr: ovp_trip_hi - V_MODULE_OP_MAX
    unit: V
    display: { unit: V, digits: 2 }
  ratio_retune:
    expr: v_bus_max / V_OVPF_MIN * divider_ratio / ratio_min
    unit: ""
    display: { unit: "", digits: 4 }
  ovp_trip_hi_retune:
    expr: ovp_trip_hi * ratio_retune / divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_retune_above_operating:
    expr: ovp_trip_hi_retune - V_MODULE_OP_MAX
    unit: V
    display: { unit: V, digits: 2 }
  ovp_retune_below_abs:
    expr: V_MODULE_ABS_MAX - ovp_trip_hi_retune
    unit: V
    display: { unit: V, digits: 1 }

  # ---- the enable network ----------------------------------------------

  v_shdn_pulldown:
    expr: I_SHDN_SOURCE * R_SHDN_PULLDOWN
    unit: V
    display: { unit: V, digits: 2 }
  v_shdn_pulldown_100k:
    expr: I_SHDN_SOURCE * 10 * R_SHDN_PULLDOWN
    unit: V
    display: { unit: V, digits: 2 }
    uncited: true
  v_shdn_driven:
    expr: V_RAIL3V3 * R_SHDN_PULLDOWN / (R_SHDN_PULLDOWN + R_GPIO_SERIES)
    unit: V
    display: { unit: V, digits: 2 }
  r_thevenin_shdn:
    expr: R_SHDN_PULLDOWN * R_GPIO_SERIES / (R_SHDN_PULLDOWN + R_GPIO_SERIES)
    unit: ohm
    display: { unit: ohm, digits: 3 }
  r_ds_required_fault:
    expr: r_thevenin_shdn * V_SHDN_THRESHOLD / (v_shdn_driven - V_SHDN_THRESHOLD)
    unit: ohm
    display: { unit: ohm, digits: 2 }
  i_gpio_through_fault:
    expr: (V_RAIL3V3 - v_shdn_pulldown) / R_GPIO_SERIES
    unit: A
    display: { unit: mA, digits: 2 }

tables:

  power-budget:
    columns: ["Modules", "Power", "Perceived", "fps (2 ch)", "Binds on"]
    align: [right, right, right, right, left]
    rows:
      - ["10", "=brightness_10", "=perceived_10", "=fps_at_5 @ ,3", "thermal"]
      - ["14", "=brightness_14", "=perceived_14", "=fps_at_7 @ ,3", "thermal"]
      - ["20", "=brightness_20", "=perceived_20", "=fps_design @ ,2", "power"]
      - ["24", "=brightness_24", "=perceived_24", "=fps_at_12 @ ,2", "power"]

  cable-drop:
    columns: ["mm²", "5 m", "10 m", "15 m", "max at 5%"]
    align: [left, right, right, right, right]
    rows:
      - ["0.25", "=i_channel_worst*2*RHO_CU*5/CSA_025 @ V,3",
                "=i_channel_worst*2*RHO_CU*10/CSA_025 @ V,3",
                "=i_channel_worst*2*RHO_CU*15/CSA_025 @ V,3",
                "=v_drop_allowed*CSA_025/(2*RHO_CU*i_channel_worst) @ m,2"]
      - ["0.34", "=i_channel_worst*2*RHO_CU*5/CSA_034 @ V,3",
                "=i_channel_worst*2*RHO_CU*10/CSA_034 @ V,3",
                "=i_channel_worst*2*RHO_CU*15/CSA_034 @ V,3",
                "=v_drop_allowed*CSA_034/(2*RHO_CU*i_channel_worst) @ m,2"]
      - ["**0.50**", "**{=i_channel_worst*2*RHO_CU*5/CSA_REF @ V,2}**",
                     "**{=i_channel_worst*2*RHO_CU*10/CSA_REF @ V,3}**",
                     "{=i_channel_worst*2*RHO_CU*15/CSA_REF @ V,3}",
                     "**{=l_max_worst @ m,2}**"]
      - ["0.75", "=i_channel_worst*2*RHO_CU*5/CSA_ALT @ V,2",
                "=i_channel_worst*2*RHO_CU*10/CSA_ALT @ V,3",
                "=i_channel_worst*2*RHO_CU*15/CSA_ALT @ V,3",
                "=l_max_alt @ m,3"]
      - ["1.00", "=i_channel_worst*2*RHO_CU*5/CSA_100 @ V,2",
                "=i_channel_worst*2*RHO_CU*10/CSA_100 @ V,2",
                "=i_channel_worst*2*RHO_CU*15/CSA_100 @ V,3",
                "=v_drop_allowed*CSA_100/(2*RHO_CU*i_channel_worst) @ m,3"]

  pwm-ripple:
    columns: ["cable", "R (loop)", "bus share", "ripple seen"]
    align: [left, right, right, right]
    rows:
      - ["~5 m, 0.5 mm²", "=R_LOOP_SHORT @ Ω,2", "=bus_share_short",
         "**+{=ripple_up_short @ ,2} / −{=-ripple_down_short @ ,2} A**"]
      - ["10 m, 0.5 mm²", "=R_LOOP_REF @ Ω,2", "=bus_share_ref",
         "**+{=ripple_up_ref @ ,2} / −{=-ripple_down_ref @ ,2} A**"]

  two-channels:
    columns: ["channels", "modules/ch", "fps", "A/ch balanced", "% of 10 A", "A/ch worst case", "%"]
    align: [right, right, right, right, right, right, right]
    rows:
      - ["**2**", "**{=modules_per_channel @ ,2}**", "**{=fps_design @ ,2}**",
         "**{=i_channel_balanced @ A,3}**", "**{=conn_share_balanced @ %,2}**",
         "{=i_channel_worst @ A,3}", "{=conn_share_worst @ %,2}"]
      - ["3", "=N_MODULES/3 @ ,2", "=1/(N_MODULES/3*LEDS_PER_MODULE*T_PER_LED+T_RESET) @ ,3",
         "=i_bus_full_white*brightness_20/3 @ A,3", "=i_bus_full_white*brightness_20/3/CONN_RATING @ %,2",
         "=i_bus_full_white*CAP_THERMAL/3 @ A,3", "=i_bus_full_white*CAP_THERMAL/3/CONN_RATING @ %,2"]
      - ["4", "=N_MODULES/4 @ ,2", "=1/(N_MODULES/4*LEDS_PER_MODULE*T_PER_LED+T_RESET) @ ,3",
         "=i_bus_full_white*brightness_20/4 @ A,3", "=i_bus_full_white*brightness_20/4/CONN_RATING @ %,2",
         "=i_bus_full_white*CAP_THERMAL/4 @ A,3", "=i_bus_full_white*CAP_THERMAL/4/CONN_RATING @ %,2"]

  rail5-dropout:
    columns: ["bus", "5 V rail", "74AHCT541 needs 4.5-5.5 V"]
    align: [left, right, left]
    rows:
      - ["4.75 V (USB-C low tolerance)", "**{=v_rail5_typ_lo @ V,3}**",
         "{=margin_buffer_typ @ V,1} over the floor"]
      - ["5.00 V", "=v_rail5_typ_nom", "ok"]
      - [">= 5.25 V", "=V_RAIL5_NOM @ V,3", "ok"]

  rail3v3-loads:
    columns: ["Load", "mA", "Note"]
    align: [left, right, left]
    rows:
      - ["ESP32-C6, TX peak", "=I_ESP32_TX @ [mA],3",
         "datasheet Table 13, 802.11b at 20.5 dBm, 100% duty — pessimistic as a continuous figure"]
      - ["Ethernet module", "=i_eth_module @ [mA],3", "0.50 W at 3.3 V"]
      - ["2x MAX3485", "~{=i_max3485_pair @ [mA],2}",
         "2 mA I_CC each **plus ~12 mA each of line current** — a driver with DE asserted pulls load current 100% of the time"]
      - ["HUSB238A VDD", "=I_HUSB_VDD @ [mA],2", "active sink"]
      - ["INA226 + pull-ups", "~{=I_INA_AND_PULLUPS @ [mA],1}", ""]
      - ["**total**", "**~{=i_rail3v3 @ mA,3} = {=p_rail3v3 @ W,3}**",
         "inside the ~2.3 W the rail is sized for"]

  cascade-penalty:
    columns: ["", "efficiency", "lost at the 1.89 W draw", "at the 2.3 W sizing ceiling"]
    align: [left, right, right, right]
    rows:
      - ["cascade, 36 -> 5 -> 3.3 V", "~{=ETA_CASCADE @ %,2}", "=loss_cascade_draw", "=loss_cascade_sized"]
      - ["hypothetical single 36 -> 3.3 V", "~{=ETA_SINGLE @ %,2}", "=loss_single_draw", "=loss_single_sized"]
      - ["**penalty**", "", "**{=penalty_draw @ mW,2}**", "**{=penalty_sized @ mW,2}**"]

  cooling-fan:
    columns: ["fan", "R_DS typ (0.12 Ω)", "6 V-drive max (0.190 Ω)", "**applicable max (≈0.24 Ω)**"]
    align: [left, right, right, right]
    rows:
      - ["none", "=v_rail5_typ_lo @ V,4", "=v_rail5_6v_max @ V,4", "**{=v_rail5_applicable @ V,4}**"]
      - ["25 mm, ~50 mA",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_TYP+R_DCR_L1)*(I_RAIL5+I_FAN_25MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_6V_MAX+R_DCR_L1)*(I_RAIL5+I_FAN_25MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_APPLICABLE+R_DCR_L1)*(I_RAIL5+I_FAN_25MM) @ V,4"]
      - ["58 mA",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_TYP+R_DCR_L1)*(I_RAIL5+I_FAN_58) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_6V_MAX+R_DCR_L1)*(I_RAIL5+I_FAN_58) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_APPLICABLE+R_DCR_L1)*(I_RAIL5+I_FAN_58) @ V,4"]
      - ["30 mm, ~70 mA",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_TYP+R_DCR_L1)*(I_RAIL5+I_FAN_30MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_6V_MAX+R_DCR_L1)*(I_RAIL5+I_FAN_30MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_APPLICABLE+R_DCR_L1)*(I_RAIL5+I_FAN_30MM) @ V,4"]
      - ["40 mm, ~100 mA",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_TYP+R_DCR_L1)*(I_RAIL5+I_FAN_40MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_6V_MAX+R_DCR_L1)*(I_RAIL5+I_FAN_40MM) @ V,4",
         "=0.99*V_VSAFE5V_LO-0.01*V_F_SS36-(0.99*R_DS_APPLICABLE+R_DCR_L1)*(I_RAIL5+I_FAN_40MM) @ V,4"]

  follower-margins:
    columns: ["PDO", "band", "threshold", "pin at a −5% bus", "margin"]
    align: [left, left, right, right, right]
