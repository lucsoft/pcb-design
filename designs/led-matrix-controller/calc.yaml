derived:

  # ---- budget ---------------------------------------------------------

  p_budget:
    expr: V_BUS * I_CONTRACT
    unit: W
    display: { unit: W, digits: 3 }
  p_modules:
    expr: p_budget - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
  p_gpio_mode:
    expr: V_GPIO_MODE * I_GPIO_MODE
    unit: W
    display: { unit: W, digits: 2 }
  v_bus_max:
    expr: V_BUS * (1 + PDO_TOLERANCE)
    unit: V
    display: { unit: V, digits: 3 }
  v_bus_min:
    expr: V_BUS * (1 - PDO_TOLERANCE)
    unit: V
    display: { unit: V, digits: 3 }

  p_modules_48v:
    expr: P_BUDGET_48V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
    uncited: true
  conn_share_balanced:
    expr: i_channel_balanced / CONN_RATING
    unit: ""
    display: { unit: "%", digits: 2 }
  conn_share_worst:
    expr: i_channel_worst / CONN_RATING
    unit: ""
    display: { unit: "%", digits: 2 }
  conn_margin:
    expr: CONN_RATING / i_channel_worst
    unit: ""
    display: { unit: "x", digits: 2 }

  # ---- brightness and frame rate --------------------------------------

  modules_per_channel:
    expr: N_MODULES / N_CHANNELS
    unit: ""
    display: { unit: "", digits: 2 }
  brightness_10:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (10 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_14:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (14 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_20:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (N_MODULES * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  brightness_24:
    expr: min(CAP_THERMAL, p_modules * ETA_MODULE / (24 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_10:
    expr: brightness_10 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_14:
    expr: brightness_14 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_20:
    expr: brightness_20 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_24:
    expr: brightness_24 ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  fps_at_5:
    expr: 1 / (5 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 3 }
  fps_at_7:
    expr: 1 / (7 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 3 }
  fps_design:
    expr: 1 / (modules_per_channel * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_12:
    expr: 1 / (12 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_15:
    expr: 1 / (15 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }
  fps_at_20:
    expr: 1 / (20 * LEDS_PER_MODULE * T_PER_LED + T_RESET)
    unit: Hz
    display: { unit: fps, digits: 2 }

  # the 140 W / 28 V alternative, for Why not 28 V
  p_modules_28v:
    expr: P_BUDGET_28V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
    uncited: true
  brightness_14_at_28v:
    expr: min(CAP_THERMAL, p_modules_28v * ETA_MODULE / (14 * MODULE_FULL_W))
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_14_at_28v:
    expr: brightness_14_at_28v ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_20_at_28v:
    expr: min(CAP_THERMAL, p_modules_28v * ETA_MODULE / (N_MODULES * MODULE_FULL_W)) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- current --------------------------------------------------------

  i_module_full:
    expr: MODULE_FULL_W / V_MODULE_RAIL
    unit: A
    display: { unit: A, digits: 3 }
  i_wall_full_5v:
    expr: N_MODULES * i_module_full
    unit: A
    display: { unit: A, digits: 3 }
  p_wall_full:
    uncited: "an intermediate; the contract table cites what it feeds"
    expr: N_MODULES * MODULE_FULL_W
    unit: W
    display: { unit: W, digits: 3 }
  limiter_divisor:
    expr: V_BUS * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_20V:
    expr: V_PDO_20 * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_12V:
    expr: V_PDO_12 * ETA_MODULE / V_MODULE_RAIL
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_divisor_error_12V:
    expr: limiter_divisor / limiter_divisor_12V
    unit: ""
    display: { unit: "x", digits: 2 }
  limiter_divisor_wrong:
    expr: V_BUS / V_MODULE_RAIL / ETA_MODULE
    unit: ""
    display: { unit: "", digits: 2 }
  limiter_underprediction:
    expr: 1 - limiter_divisor / limiter_divisor_wrong
    unit: ""
    display: { unit: "%", digits: 2 }
  i_bus_full_white:
    expr: i_wall_full_5v / limiter_divisor
    unit: A
    display: { unit: A, digits: 2 }
  i_channel_flash:
    expr: i_bus_full_white / N_CHANNELS
    unit: A
    display: { unit: A, digits: 2 }
  i_channel_balanced:
    expr: i_channel_flash * brightness_20
    unit: A
    display: { unit: A, digits: 3 }
  i_channel_worst:
    expr: i_channel_flash * CAP_THERMAL
    unit: A
    display: { unit: A, digits: 3 }
  i_channel_balanced_margin:
    expr: 1 - i_channel_balanced / i_channel_worst
    unit: ""
    display: { unit: "%", digits: 2 }

  n_ics:
    expr: N_MODULES * LEDS_PER_MODULE
    unit: ""
    display: { unit: "", digits: 3 }
  i_quiescent_lo:
    expr: n_ics * I_Q_PER_IC_LO
    unit: A
    display: { unit: A, digits: 2 }
  i_quiescent_hi:
    expr: n_ics * I_Q_PER_IC_HI
    unit: A
    display: { unit: A, digits: 2 }
  p_quiescent_lo:
    expr: i_quiescent_lo * V_MODULE_RAIL / ETA_MODULE
    unit: W
    display: { unit: W, digits: 2 }
  p_quiescent_hi:
    expr: i_quiescent_hi * V_MODULE_RAIL / ETA_MODULE
    unit: W
    display: { unit: W, digits: 2 }
  quiescent_share_lo:
    expr: p_quiescent_lo / p_budget
    unit: ""
    display: { unit: "%", digits: 2 }
  quiescent_share_hi:
    expr: p_quiescent_hi / p_budget
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- cable ----------------------------------------------------------

  r_cable_ref:
    uncited: "an intermediate; the cable table and the power figures cite what it feeds"
    expr: 2 * RHO_CU * L_REF / CSA_REF
    unit: ohm
    display: { unit: Ω, digits: 3 }
  v_drop_ref:
    uncited: "the 10 m / 0.5 mm2 cell of the generated cable table, which is rendered from the expression"
    expr: i_channel_worst * r_cable_ref
    unit: V
    display: { unit: V, digits: 3 }
  p_cable_balanced:
    expr: i_channel_balanced ** 2 * r_cable_ref
    unit: W
    display: { unit: W, digits: 3 }
  p_cable_worst:
    expr: i_channel_worst ** 2 * r_cable_ref
    unit: W
    display: { unit: W, digits: 3 }
  p_cable_total:
    expr: N_CHANNELS * p_cable_balanced
    unit: W
    display: { unit: W, digits: 2 }
  i_contract_with_cable:
    expr: (p_budget + p_cable_total) / V_BUS
    unit: A
    display: { unit: A, digits: 2 }
  v_drop_allowed:
    expr: DROP_BUDGET * V_BUS
    unit: V
    display: { unit: V, digits: 2 }
  l_max_worst:
    expr: v_drop_allowed * CSA_REF / (2 * RHO_CU * i_channel_worst)
    unit: m
    display: { unit: m, digits: 2 }
  l_max_balanced:
    expr: v_drop_allowed * CSA_REF / (2 * RHO_CU * i_channel_balanced)
    unit: m
    display: { unit: m, digits: 3 }
  l_max_alt:
    expr: v_drop_allowed * CSA_ALT / (2 * RHO_CU * i_channel_worst)
    unit: m
    display: { unit: m, digits: 3 }
  v_module_headroom:
    expr: V_BUS - V_MODULE_IN_MIN
    unit: V
    display: { unit: V, digits: 3 }

  # ---- the PWM ripple divider -----------------------------------------

  c_channel_bank:
    expr: modules_per_channel * C_MODULE_BULK
    unit: F
    display: { unit: mF, digits: 2 }
  z_bank:
    expr: 1 / (2 * pi * F_PWM * c_channel_bank)
    unit: ohm
    display: { unit: Ω, digits: 3 }
  bus_share_short:
    expr: z_bank / sqrt(R_LOOP_SHORT ** 2 + z_bank ** 2)
    unit: ""
    display: { unit: "%", digits: 3 }
  bus_share_ref:
    expr: z_bank / sqrt(R_LOOP_REF ** 2 + z_bank ** 2)
    unit: ""
    display: { unit: "%", digits: 3 }
  ripple_up_short:
    expr: (i_channel_flash - i_channel_balanced) * bus_share_short
    unit: A
    display: { unit: A, digits: 2 }
  ripple_down_short:
    expr: -i_channel_balanced * bus_share_short
    unit: A
    display: { unit: A, digits: 2 }
  ripple_up_ref:
    expr: (i_channel_flash - i_channel_balanced) * bus_share_ref
    unit: A
    display: { unit: A, digits: 2 }
  ripple_down_ref:
    expr: -i_channel_balanced * bus_share_ref
    unit: A
    display: { unit: A, digits: 2 }

  t_pwm_period:
    expr: 1 / F_PWM
    unit: s
    display: { unit: ms, digits: 2 }
  drop_share_5v:
    expr: V_DROP_EXAMPLE / V_MODULE_RAIL
    unit: ""
    display: { unit: "%", digits: 2 }
  drop_share_36v:
    expr: V_DROP_EXAMPLE / V_BUS
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- the 5 V rail ----------------------------------------------------
  #
  # TPS54360B datasheet p.12 Eq. 1, inverted:
  #   V_OUT = 0.99 V_IN + 0.99 V_F - 0.99 R_DS I_OUT - V_F - R_dc I_OUT
  # capped at the regulated 5.0 V, which is what the rail does once the input
  # rises far enough to leave pass-through.

  r_ds_applicable_lo:
    expr: R_DS_6V_MAX * R_DS_RATIO_LO
    unit: ohm
    display: { unit: ohm, digits: 3 }
    uncited: true
  r_ds_applicable_hi:
    expr: R_DS_6V_MAX * R_DS_RATIO_HI
    unit: ohm
    display: { unit: ohm, digits: 3 }
    uncited: true
  r_ds_applicable_check:
    expr: R_DS_APPLICABLE
    unit: ohm
    display: { unit: ohm, digits: 2 }
    limit: { min: r_ds_applicable_lo, max: r_ds_applicable_hi,
             why: "the working value has to stay inside the band Figure 1's ratio gives" }
    uncited: true

  v_rail5_typ_lo:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_typ_nom:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_NOM - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 3 }
  v_rail5_6v_max:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_6V_MAX + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_applicable:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_APPLICABLE + R_DCR_L1) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 4 }
  v_rail5_alt_dcr:
    expr: min(V_RAIL5_NOM, 0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - (0.99 * R_DS_TYP + R_DCR_ALT) * I_RAIL5)
    unit: V
    display: { unit: V, digits: 3 }
  r_ds_at_buffer_floor:
    expr: (0.99 * V_VSAFE5V_LO - 0.01 * V_F_SS36 - V_BUFFER_MIN - R_DCR_L1 * I_RAIL5) / (0.99 * I_RAIL5)
    unit: ohm
    display: { unit: ohm, digits: 3 }
  margin_buffer_typ:
    expr: v_rail5_typ_lo - V_BUFFER_MIN
    unit: V
    display: { unit: V, digits: 2 }
  margin_buffer_applicable:
    uncited: "the prose states this one as a shortfall; see shortfall_buffer_applicable"
    expr: v_rail5_applicable - V_BUFFER_MIN
    unit: V
    display: { unit: mV, digits: 2 }

  # ---- what D14 holds the VBUS pin at ----------------------------------

  shortfall_buffer_applicable:
    expr: V_BUFFER_MIN - v_rail5_applicable
    unit: V
    display: { unit: mV, digits: 2 }
  shortfall_uv_f0:
    expr: uv_bound_f0 - v_pin_applicable
    unit: V
    display: { unit: V, digits: 2 }

  v_pin_typ:
    expr: v_rail5_typ_lo - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  v_pin_applicable:
    expr: v_rail5_applicable - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  v_pin_6v_max:
    expr: v_rail5_6v_max - V_D14_DROP
    unit: V
    display: { unit: V, digits: 3 }
  margin_pin_min:
    expr: v_pin_typ - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 3 }
  margin_vbprs_typ_at_applicable:
    expr: v_pin_applicable - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_max_at_applicable:
    expr: v_pin_applicable - V_VBPRS_R_MAX
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_typ_at_typ:
    expr: v_pin_typ - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  margin_vbprs_max_at_typ:
    expr: v_pin_typ - V_VBPRS_R_MAX
    unit: V
    display: { unit: V, digits: 2 }
  uv_bound_f1:
    expr: UV_BAND_F1 * V_VSAFE5V_NOM
    unit: V
    display: { unit: V, digits: 3 }
  uv_bound_f0:
    expr: UV_BAND_F0 * V_VSAFE5V_NOM
    unit: V
    display: { unit: V, digits: 3 }
  margin_uv_f1_applicable:
    expr: v_pin_applicable - uv_bound_f1
    unit: V
    display: { unit: V, digits: 2 }
  margin_uv_f0_applicable:
    expr: v_pin_applicable - uv_bound_f0
    unit: V
    display: { unit: V, digits: 2 }
  margin_uv_f1_typ:
    expr: v_pin_typ - uv_bound_f1
    unit: V
    display: { unit: V, digits: 2 }

  # ---- logic levels ----------------------------------------------------

  vih_status_chain:
    expr: VIH_SK6812_RATIO * V_RAIL5_NOM
    unit: V
    display: { unit: V, digits: 3 }
  vih_status_at_sag:
    expr: VIH_SK6812_RATIO * v_rail5_typ_lo
    unit: V
    display: { unit: V, digits: 3 }
  voh_esp32:
    expr: VOH_ESP32_RATIO * V_RAIL3V3
    unit: V
    display: { unit: V, digits: 3 }
  logic_shortfall:
    expr: vih_status_chain - voh_esp32
    unit: V
    display: { unit: mV, digits: 3 }

  # ---- the 3.3 V rail --------------------------------------------------

  i_eth_module:
    expr: P_ETH_MODULE / V_RAIL3V3
    unit: A
    display: { unit: mA, digits: 3 }
  i_max3485_pair:
    expr: N_CHANNELS * (I_MAX3485_ICC + I_MAX3485_LINE)
    unit: A
    display: { unit: mA, digits: 2 }
  i_rail3v3:
    expr: I_ESP32_TX + i_eth_module + i_max3485_pair + I_HUSB_VDD + I_INA_AND_PULLUPS
    unit: A
    display: { unit: mA, digits: 3 }
  p_rail3v3:
    expr: i_rail3v3 * V_RAIL3V3
    unit: W
    display: { unit: W, digits: 3 }
  p_max3485_total:
    expr: i_max3485_pair * V_RAIL3V3
    unit: W
    display: { unit: mW, digits: 2 }
  p_max3485_termination:
    expr: N_CHANNELS * I_MAX3485_LINE ** 2 * R_TERM
    unit: W
    display: { unit: mW, digits: 2 }
  share_offboard:
    expr: p_max3485_termination / p_max3485_total
    unit: ""
    display: { unit: "%", digits: 2 }
  share_onboard:
    expr: 1 - share_offboard
    unit: ""
    display: { unit: "%", digits: 2 }
  p_max3485_onboard:
    expr: p_max3485_total - p_max3485_termination
    unit: W
    display: { unit: W, digits: 2 }
  p_ldo_alternative:
    expr: (v_rail5_typ_nom - V_RAIL3V3) * I_ESP32_TX
    unit: W
    display: { unit: W, digits: 1 }

  loss_cascade_draw:
    expr: p_rail3v3 * (1 / ETA_CASCADE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  loss_single_draw:
    expr: p_rail3v3 * (1 / ETA_SINGLE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  penalty_draw:
    expr: loss_cascade_draw - loss_single_draw
    unit: W
    display: { unit: mW, digits: 2 }
  loss_cascade_sized:
    expr: P_RAIL3V3_SIZED * (1 / ETA_CASCADE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  loss_single_sized:
    expr: P_RAIL3V3_SIZED * (1 / ETA_SINGLE - 1)
    unit: W
    display: { unit: W, digits: 3 }
  penalty_sized:
    expr: loss_cascade_sized - loss_single_sized
    unit: W
    display: { unit: mW, digits: 2 }

  # ---- the follower ----------------------------------------------------
  #
  # R44 is the only path into the base, so the base sits I_B x R44 below the
  # collector and the emitter one V_BE below that. The disconnect threshold is
  # a percentage of the REQUESTED voltage, so a fixed offset is a bigger
  # fraction of a smaller contract -- which is what makes 12 V the pinch point.

  i_base:
    expr: I_VBUS_PIN_MAX / H_FE_Q3
    unit: A
    display: { unit: uA, digits: 2 }
  v_r44_drop:
    expr: i_base * R44
    unit: V
    display: { unit: mV, digits: 2 }
  pin_at_9v:
    expr: 0.95 * V_PDO_9 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  pin_at_12v:
    expr: 0.95 * V_PDO_12 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_at_15v:
    expr: 0.95 * V_PDO_15 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_at_20v:
    expr: 0.95 * V_PDO_20 - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_clamped:
    expr: V_ZENER_LO - V_BE_Q3
    unit: V
    display: { unit: V, digits: 4 }
  pin_clamped_hi:
    expr: V_ZENER_HI - V_BE_Q3_LO
    unit: V
    display: { unit: V, digits: 4 }
  margin_9v:
    expr: pin_at_9v - UV_BAND_F1 * V_PDO_9
    unit: V
    display: { unit: V, digits: 2 }
  margin_12v:
    expr: pin_at_12v - UV_BAND_F0 * V_PDO_12
    unit: V
    display: { unit: V, digits: 2 }
  margin_15v:
    expr: pin_at_15v - UV_BAND_F0 * V_PDO_15
    unit: V
    display: { unit: V, digits: 2 }
  margin_20v:
    expr: pin_at_20v - UV_BAND_F0 * V_PDO_20
    unit: V
    display: { unit: V, digits: 2 }
  margin_clamped:
    expr: pin_clamped - V_UV_F2
    unit: V
    display: { unit: V, digits: 3 }
  margin_12v_fraction:
    expr: margin_12v / (UV_BAND_F0 * V_PDO_12)
    unit: ""
    display: { unit: "%", digits: 2 }
  margin_12v_at_hfe80:
    expr: 0.95 * V_PDO_12 - I_VBUS_PIN_MAX / H_FE_DATASHEET_MIN * R44 - V_BE_Q3 - UV_BAND_F0 * V_PDO_12
    unit: V
    display: { unit: V, digits: 2 }
  v_bus_at_uv_f2:
    expr: V_UV_F2 + V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  v_bus_ov_trip:
    expr: OV_BAND * V_BUS
    unit: V
    display: { unit: V, digits: 3 }

  # what a MOSFET follower would have needed, and what the 20 V clamp gave
  v_min_for_bss138:
    expr: V_GS_BSS138_MAX / (0.95 - UV_BAND_F0)
    unit: V
    display: { unit: V, digits: 3 }
  margin_20v_bss138:
    expr: 0.95 * V_PDO_20 - V_GS_BSS138_MAX - UV_BAND_F0 * V_PDO_20
    unit: V
    display: { unit: V, digits: 1 }
  pin_c20_nom:
    expr: V_ZENER_C20_NOM - V_GS_BSS138_TYP
    unit: V
    display: { unit: V, digits: 3 }
  pin_c20_lo:
    expr: V_ZENER_C20_LO - V_GS_BSS138_MAX
    unit: V
    display: { unit: V, digits: 3 }
  pin_c20_hi:
    expr: V_ZENER_C20_HI - V_GS_BSS138_LO
    unit: V
    display: { unit: V, digits: 3 }
  below_uv_f2_c20:
    expr: V_UV_F2 - pin_c20_nom
    unit: V
    display: { unit: V, digits: 2 }

  # ---- what the follower does at the bottom of vSafe5V -----------------

  pin_follower_lo:
    expr: V_VSAFE5V_LO - v_r44_drop - V_BE_Q3
    unit: V
    display: { unit: V, digits: 3 }
  pin_follower_hi:
    expr: V_VSAFE5V_LO - v_r44_drop - V_BE_Q3_LO
    unit: V
    display: { unit: V, digits: 3 }
  margin_follower_vbus_min:
    expr: pin_follower_lo - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 2 }
  margin_follower_vbprs:
    expr: pin_follower_lo - V_VBPRS_R_TYP
    unit: V
    display: { unit: V, digits: 2 }
  vbus_pin_requirement_drop:
    expr: V_VBUS_PIN_MIN_NOVDD - V_VBUS_PIN_MIN
    unit: V
    display: { unit: V, digits: 3 }
  vbus_pin_current_ratio:
    expr: I_VBUS_PIN_NOVDD_MAX / I_VBUS_PIN_MAX
    unit: ""
    display: { unit: "x", digits: 2 }
  pin_at_36v_nominal:
    expr: V_ZENER_NOM - (V_BE_Q3 + V_BE_Q3_LO) / 2
    unit: V
    display: { unit: V, digits: 3 }
  v_schottky_reverse:
    expr: pin_at_36v_nominal - V_RAIL5_NOM
    unit: V
    display: { unit: V, digits: 3 }

  # ---- Q3 and R44 at the corners ---------------------------------------

  v_ce_q3_normal:
    expr: v_bus_max - pin_clamped
    unit: V
    display: { unit: V, digits: 4 }
  v_ce_q3_clamp:
    expr: V_TVS_CLAMP - pin_clamped
    unit: V
    display: { unit: V, digits: 4 }
  v_ce_bss138_ratio:
    expr: V_DS_BSS138 / v_ce_q3_clamp
    unit: ""
    display: { unit: "x", digits: 2 }
  v_across_r44_nominal:
    expr: V_BUS - V_ZENER_NOM
    unit: V
    display: { unit: V, digits: 2 }
  i_zener:
    expr: v_across_r44_nominal / R44
    unit: A
    display: { unit: mA, digits: 3 }
  p_r44_nominal:
    expr: v_across_r44_nominal ** 2 / R44
    unit: W
    display: { unit: mW, digits: 2 }
  p_r44_vendor_step:
    expr: v_across_r44_nominal ** 2 / R44_ALT_47
    unit: W
    display: { unit: mW, digits: 2 }
  derating_r44_nominal:
    expr: p_r44_nominal / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  derating_r44_vendor_step:
    expr: p_r44_vendor_step / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  v_across_r44_corner:
    expr: v_bus_max - V_ZENER_LO
    unit: V
    display: { unit: V, digits: 4 }
  p_r44_corner:
    expr: v_across_r44_corner ** 2 / R44
    unit: W
    display: { unit: mW, digits: 3 }
  derating_r44_corner:
    expr: p_r44_corner / P_RATING_0402
    unit: ""
    display: { unit: "%", digits: 2 }
  v_across_r44_clamp:
    expr: V_TVS_CLAMP - V_ZENER_LO
    unit: V
    display: { unit: V, digits: 4 }
  p_r44_clamp:
    expr: v_across_r44_clamp ** 2 / R44
    unit: W
    display: { unit: mW, digits: 3 }
  derating_r44_clamp:
    expr: p_r44_clamp / P_RATING_0402
    unit: ""
    display: { unit: "x", digits: 2 }
  p_zener:
    expr: V_ZENER_NOM * i_zener
    unit: W
    display: { unit: mW, digits: 2 }
  p_q3_collector:
    expr: (V_BUS - (V_ZENER_NOM - V_BE_Q3)) * I_VBUS_PIN_MAX
    unit: W
    display: { unit: mW, digits: 2 }
  p_front_end:
    expr: p_q3_collector + p_r44_nominal + p_zener
    unit: W
    display: { unit: W, digits: 2 }

  # ---- the eFuse's programmed values -----------------------------------

  i_limit:
    expr: ILIM_PRODUCT / R_ILIM
    unit: A
    display: { unit: A, digits: 3 }
  i_limit_low_corner:
    expr: i_limit * (1 - ILIM_TOLERANCE)
    unit: A
    display: { unit: A, digits: 3 }
    uncited: true
  ilim_margin:
    expr: i_limit_low_corner / i_channel_flash
    unit: ""
    display: { unit: "x", digits: 3 }
  gain_dvdt_check:
    expr: 1 / (K_DVDT * I_DVDT_TYP)
    unit: ""
    display: { unit: "", digits: 3 }
  t_dvdt:
    expr: K_DVDT * V_BUS * C_DVDT
    unit: s
    display: { unit: ms, digits: 3 }
  t_dvdt_lo:
    expr: V_BUS * C_DVDT / (GAIN_DVDT_MAX * I_DVDT_MAX)
    unit: s
    display: { unit: ms, digits: 3 }
  t_dvdt_hi:
    expr: V_BUS * C_DVDT / (GAIN_DVDT_MIN * I_DVDT_MIN)
    unit: s
    display: { unit: ms, digits: 3 }
  i_inrush:
    expr: c_channel_bank * V_BUS / t_dvdt
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_lo:
    expr: c_channel_bank * V_BUS / t_dvdt_hi
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_hi:
    expr: c_channel_bank * V_BUS / t_dvdt_lo
    unit: A
    display: { unit: A, digits: 2 }
  i_inrush_both:
    expr: N_CHANNELS * i_inrush
    unit: A
    display: { unit: A, digits: 3 }
  inrush_share_36v:
    expr: i_inrush_both / I_CONTRACT
    unit: ""
    display: { unit: "%", digits: 2 }
  inrush_share_12v:
    expr: i_inrush_both / I_CONTRACT_12V
    unit: ""
    display: { unit: "%", digits: 2 }
  t_turn_on:
    expr: T_TURN_ON_BASE + T_TURN_ON_PER_NF * C_DVDT
    unit: s
    display: { unit: ms, digits: 3 }
  c_channel_bank_20:
    expr: 2 * c_channel_bank
    unit: F
    display: { unit: mF, digits: 2 }
  i_inrush_20:
    expr: c_channel_bank_20 * V_BUS / t_dvdt
    unit: A
    display: { unit: A, digits: 3 }

  # ---- the ramp as energy ----------------------------------------------

  energy_channel:
    expr: 0.5 * c_channel_bank * V_BUS ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ti_demo:
    expr: 0.5 * C_TI_DEMO * V_TI_DEMO ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ratio:
    expr: energy_ti_demo / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  energy_channel_20:
    expr: 0.5 * c_channel_bank_20 * V_BUS ** 2
    unit: J
    display: { unit: J, digits: 3 }
  energy_ratio_20:
    expr: energy_ti_demo / energy_channel_20
    unit: ""
    display: { unit: "x", digits: 2 }
  p_inrush:
    expr: 0.5 * V_BUS * i_inrush
    unit: W
    display: { unit: W, digits: 2 }
  p_inrush_both:
    expr: N_CHANNELS * p_inrush
    unit: W
    display: { unit: W, digits: 2 }
  p_inrush_lo:
    expr: 0.5 * V_BUS * i_inrush_lo
    unit: W
    display: { unit: W, digits: 3 }
  p_inrush_hi:
    expr: 0.5 * V_BUS * i_inrush_hi
    unit: W
    display: { unit: W, digits: 3 }
  energy_available_lo:
    expr: P_FIG13_TIMEOUT_LO * T_TREG_TIMEOUT
    unit: J
    display: { unit: J, digits: 2 }
  energy_available_hi:
    expr: P_FIG13_TIMEOUT_HI * T_TREG_TIMEOUT
    unit: J
    display: { unit: J, digits: 2 }
  margin_treg_lo:
    expr: energy_available_lo / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  margin_treg_hi:
    expr: energy_available_hi / energy_channel
    unit: ""
    display: { unit: "x", digits: 2 }
  p_fig13_85c:
    expr: E_FIG13_85C / T_TREG_TIMEOUT
    unit: W
    display: { unit: W, digits: 1 }
  margin_treg_85c:
    expr: E_FIG13_85C / energy_channel
    unit: ""
    display: { unit: "x", digits: 1 }
  margin_treg_85c_20:
    expr: E_FIG13_85C / energy_channel_20
    unit: ""
    display: { unit: "x", digits: 3 }

  # ---- the UVLO / OVP divider ------------------------------------------

  r_divider_total:
    expr: R_UV1 + R_UV2 + R_UV3
    unit: ohm
    display: { unit: kohm, digits: 4 }
    uncited: true
  uvlo_trip:
    expr: V_REF_EFUSE * r_divider_total / (R_UV2 + R_UV3)
    unit: V
    display: { unit: V, digits: 3 }
  uvlo_falling:
    expr: (V_REF_EFUSE - UVLO_HYST) * r_divider_total / (R_UV2 + R_UV3)
    unit: V
    display: { unit: V, digits: 3 }
  divider_ratio:
    expr: r_divider_total / R_UV3
    unit: ""
    display: { unit: "", digits: 3 }
  ovp_trip:
    expr: V_REF_EFUSE * divider_ratio
    unit: V
    display: { unit: V, digits: 4 }
  i_divider:
    expr: V_BUS / r_divider_total
    unit: A
    display: { unit: uA, digits: 3 }
  ratio_min:
    expr: ((R_UV1 + R_UV2) * (1 - RES_TOL) + R_UV3 * (1 + RES_TOL)) / (R_UV3 * (1 + RES_TOL))
    unit: ""
    display: { unit: "", digits: 4 }
    uncited: true
  ratio_max:
    expr: ((R_UV1 + R_UV2) * (1 + RES_TOL) + R_UV3 * (1 - RES_TOL)) / (R_UV3 * (1 - RES_TOL))
    unit: ""
    display: { unit: "", digits: 4 }
    uncited: true
  ovp_trip_lo:
    expr: V_REF_EFUSE_MIN * ratio_min
    unit: V
    display: { unit: V, digits: 3 }
  ovp_trip_hi:
    expr: V_REF_EFUSE_MAX * ratio_max
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_comparator_lo:
    expr: V_OVPF_MIN * divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_comparator_hi:
    expr: V_OVPF_MAX * divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_lo:
    expr: V_OVPF_MIN * ratio_min
    unit: V
    display: { unit: V, digits: 3 }
  ovp_release_hi:
    expr: V_OVPF_MAX * ratio_max
    unit: V
    display: { unit: V, digits: 3 }
  ovp_trip_above_bus:
    expr: ovp_trip_lo - v_bus_max
    unit: V
    display: { unit: V, digits: 2 }
  ovp_trip_below_abs:
    expr: V_MODULE_ABS_MAX - ovp_trip_hi
    unit: V
    display: { unit: V, digits: 2 }
  ovp_trip_above_operating:
    expr: ovp_trip_hi - V_MODULE_OP_MAX
    unit: V
    display: { unit: V, digits: 2 }
  ratio_retune:
    expr: v_bus_max / V_OVPF_MIN * divider_ratio / ratio_min
    unit: ""
    display: { unit: "", digits: 4 }
  ovp_trip_hi_retune:
    expr: ovp_trip_hi * ratio_retune / divider_ratio
    unit: V
    display: { unit: V, digits: 3 }
  ovp_retune_above_operating:
    expr: ovp_trip_hi_retune - V_MODULE_OP_MAX
    unit: V
    display: { unit: V, digits: 2 }
  ovp_retune_below_abs:
    expr: V_MODULE_ABS_MAX - ovp_trip_hi_retune
    unit: V
    display: { unit: V, digits: 1 }

  # ---- the enable network ----------------------------------------------

  v_shdn_pulldown:
    expr: I_SHDN_SOURCE * R_SHDN_PULLDOWN
    unit: V
    display: { unit: V, digits: 2 }
  v_shdn_pulldown_100k:
    expr: I_SHDN_SOURCE * 10 * R_SHDN_PULLDOWN
    unit: V
    display: { unit: V, digits: 2 }
    uncited: true
  v_shdn_driven:
    expr: V_RAIL3V3 * R_SHDN_PULLDOWN / (R_SHDN_PULLDOWN + R_GPIO_SERIES)
    unit: V
    display: { unit: V, digits: 2 }
  r_thevenin_shdn:
    expr: R_SHDN_PULLDOWN * R_GPIO_SERIES / (R_SHDN_PULLDOWN + R_GPIO_SERIES)
    unit: ohm
    display: { unit: ohm, digits: 3 }
  r_ds_required_fault:
    expr: r_thevenin_shdn * V_SHDN_THRESHOLD / (v_shdn_driven - V_SHDN_THRESHOLD)
    unit: ohm
    display: { unit: ohm, digits: 2 }
  i_gpio_through_fault:
    expr: (V_RAIL3V3 - v_shdn_pulldown) / R_GPIO_SERIES
    unit: A
    display: { unit: mA, digits: 2 }

  # ---- the thermal budget ---------------------------------------------

  board_area:
    expr: BOARD_W * BOARD_H
    unit: mm2
    display: { unit: cm2, digits: 3 }
  thermal_capacity:
    expr: W_PER_CM2 * board_area
    unit: W
    display: { unit: W, digits: 3 }
  p_esp32:
    expr: I_ESP32_TX * V_RAIL3V3
    unit: W
    display: { unit: W, digits: 3 }
  p_catch_diode:
    expr: I_CATCH_AVG * V_F_SS36
    unit: W
    display: { unit: W, digits: 2 }
  p_efuse_each:
    expr: i_channel_balanced ** 2 * R_DS_EFUSE_85C_MAX
    unit: W
    display: { unit: W, digits: 3 }
  p_efuse_worst:
    expr: i_channel_worst ** 2 * R_DS_EFUSE_85C_MAX
    unit: W
    display: { unit: W, digits: 3 }
  p_efuse_fets:
    expr: N_CHANNELS * p_efuse_each
    unit: W
    display: { unit: W, digits: 2 }
  p_efuse_quiescent:
    expr: N_CHANNELS * (I_EFUSE_IQ * v_bus_max + v_bus_max ** 2 / r_divider_total)
    unit: W
    display: { unit: W, digits: 2 }
  p_switched_path:
    expr: p_efuse_fets + p_efuse_quiescent
    unit: W
    display: { unit: W, digits: 2 }
  p_switched_discrete_conduction:
    expr: N_CHANNELS * i_channel_balanced ** 2 * (R_DS_DISCRETE + R_SHUNT_DISCRETE)
    unit: W
    display: { unit: W, digits: 2 }
  p_switched_delta:
    expr: p_switched_path - P_SWITCHED_DISCRETE
    unit: W
    display: { unit: W, digits: 2 }
  p_shunt:
    expr: I_CONTRACT ** 2 * R_SHUNT
    unit: W
    display: { unit: W, digits: 3 }
  i_two_efuses:
    expr: N_CHANNELS * i_limit
    unit: A
    display: { unit: A, digits: 3 }
  p_shunt_fault:
    expr: i_two_efuses ** 2 * R_SHUNT
    unit: W
    display: { unit: W, digits: 2 }
  p_inductor:
    expr: I_RAIL5 ** 2 * R_DCR_L1
    unit: W
    display: { unit: W, digits: 1 }
  p_r2_bleeder:
    expr: V_BUS ** 2 / R2_BLEEDER
    unit: W
    display: { unit: W, digits: 2 }
  p_d15_leak:
    expr: N_CHANNELS * I_D15_LEAK * V_BUS
    unit: W
    display: { unit: W, digits: 1 }

  p_status_leds:
    expr: N_STATUS_LEDS * I_LED_CHANNEL * V_RAIL5_NOM * LED_CAP_BUDGETED
    unit: W
    display: { unit: W, digits: 2 }
  p_status_leds_full_colour:
    expr: N_STATUS_LEDS * LED_COLOURS * I_LED_CHANNEL * V_RAIL5_NOM
    unit: W
    display: { unit: W, digits: 3 }
  p_status_leds_70pc:
    expr: p_status_leds_full_colour * LED_CAP_DATASHEET
    unit: W
    display: { unit: W, digits: 3 }
  p_status_leds_one_colour:
    expr: N_STATUS_LEDS * I_LED_CHANNEL * V_RAIL5_NOM
    unit: W
    display: { unit: W, digits: 2 }
  p_status_leds_plain:
    expr: N_STATUS_LEDS * I_PLAIN_LED * V_RAIL3V3
    unit: W
    display: { unit: W, digits: 2 }
  p_status_leds_mixed:
    expr: 2 * I_LED_CHANNEL * V_RAIL5_NOM * LED_CAP_BUDGETED + 6 * I_PLAIN_LED * V_RAIL3V3
    unit: W
    display: { unit: W, digits: 2 }
  p_status_leds_three:
    expr: N_LEDS_THREE_OPTION * I_LED_CHANNEL * V_RAIL5_NOM * LED_CAP_BUDGETED
    unit: W
    display: { unit: W, digits: 3 }
  p_status_led_premium:
    expr: p_status_leds - p_status_leds_plain
    unit: W
    display: { unit: mW, digits: 2 }

  p_board_total:
    expr: p_esp32 + P_ETH_MODULE + p_catch_diode + P_TPS54360B_IC + p_efuse_fets
          + p_efuse_quiescent + p_shunt + P_SY8089 + p_inductor + p_front_end
          + p_max3485_onboard + P_74AHCT541 + p_r2_bleeder + p_d15_leak
          + p_status_leds
    unit: W
    display: { unit: W, digits: 3 }
  thermal_headroom:
    expr: thermal_capacity / p_board_total
    unit: ""
    display: { unit: "x", digits: 3 }
  p_controller_slack:
    expr: P_CONTROLLER_ALLOWANCE - p_board_total
    unit: W
    display: { unit: W, digits: 2 }
  status_led_share:
    expr: p_status_led_premium / p_board_total
    unit: ""
    display: { unit: "%", digits: 2 }
  p_board_total_70pc:
    expr: p_board_total - p_status_leds + p_status_leds_70pc
    unit: W
    display: { unit: W, digits: 3 }
  thermal_overrun_70pc:
    expr: p_board_total_70pc / thermal_capacity
    unit: ""
    display: { unit: "x", digits: 3 }

  # ---- surge: what the node actually clamps at --------------------------
  #
  # A headline clamping voltage is quoted at that part's own rated surge, so
  # comparing two parts' headlines compares two different currents. What
  # decides the board is the dynamic resistance, R_d = (Vc - Vbr) / Ipp.

  rd_smcj40:
    expr: (V_C_SMCJ40 - V_BR_SMCJ40_HI) / I_PP_SMCJ40
    unit: ohm
    display: { unit: Ω, digits: 2 }
  rd_smaj36:
    expr: (V_C_SMAJ36 - V_BR_SMAJ36_HI) / I_PP_SMAJ36
    unit: ohm
    display: { unit: Ω, digits: 3 }
  clamp_smcj40_at_10a:
    expr: V_BR_SMCJ40_HI + rd_smcj40 * I_SURGE_REF
    unit: V
    display: { unit: V, digits: 3 }
  clamp_smaj36_at_10a:
    expr: V_BR_SMAJ36_HI + rd_smaj36 * I_SURGE_REF
    unit: V
    display: { unit: V, digits: 3 }
  i_smcj40_at_60v:
    expr: (V_60V_CLASS - V_BR_SMCJ40_HI) / rd_smcj40
    unit: A
    display: { unit: A, digits: 3 }
  i_smaj36_at_60v:
    expr: (V_60V_CLASS - V_BR_SMAJ36_HI) / rd_smaj36
    unit: A
    display: { unit: A, digits: 2 }
  i_smcj40_at_efuse_max:
    expr: (V_EFUSE_ABS_MAX - V_BR_SMCJ40_HI) / rd_smcj40
    unit: A
    display: { unit: A, digits: 3 }
  i_smaj36_at_efuse_max:
    expr: (V_EFUSE_ABS_MAX - V_BR_SMAJ36_HI) / rd_smaj36
    unit: A
    display: { unit: A, digits: 3 }
  i_at_j1_rating:
    expr: (V_J1_RATING - V_BR_SMCJ40_LO) / rd_smcj40
    unit: A
    display: { unit: A, digits: 2 }
  r_cable_return:
    expr: RHO_CU * L_REF / CSA_REF
    unit: ohm
    display: { unit: Ω, digits: 3 }
    uncited: true
  v_return_ir_balanced:
    expr: i_channel_balanced * r_cable_return
    unit: V
    display: { unit: V, digits: 2 }
  v_return_ir_flash:
    expr: i_channel_flash * r_cable_return
    unit: V
    display: { unit: V, digits: 3 }

  # ---- the ADC divider ---------------------------------------------------

  adc_ratio:
    expr: R32 / (R31 + R32)
    unit: ""
    display: { unit: "", digits: 4 }
    uncited: true
  v_adc_at_36v:
    expr: V_BUS * adc_ratio
    unit: V
    display: { unit: V, digits: 3 }
  v_adc_at_50v:
    expr: V_ADC_POINT_50 * adc_ratio
    unit: V
    display: { unit: V, digits: 3 }
  v_adc_at_60v:
    expr: V_ADC_POINT_60 * adc_ratio
    unit: V
    display: { unit: V, digits: 3 }
  v_bus_at_adc_ceiling:
    expr: V_ADC_USABLE / adc_ratio
    unit: V
    display: { unit: V, digits: 2 }
  v_adc_alt_at_36v:
    expr: V_BUS * R32_ALT / (R31_ALT + R32_ALT)
    unit: V
    display: { unit: V, digits: 3 }
  r_adc_source:
    expr: R31 * R32 / (R31 + R32)
    unit: ohm
    display: { unit: kohm, digits: 3 }
  tau_adc:
    expr: r_adc_source * C_ADC_TAP
    unit: s
    display: { unit: ms, digits: 3 }

  # ---- IPC-2221, external layer -----------------------------------------
  #
  #   A[mil^2] = (I / (k * dT^0.44))^(1/0.725),  w = A / (1.378 * oz)
  #
  # An empirical fit: its constants carry units nobody publishes, so the
  # dimension check is switched off here rather than left to warn forever.

  w_bus_1oz_20c:
    expr: (I_CONTRACT / (IPC_K_EXTERNAL * 20 ** 0.44)) ** (1 / 0.725) / 1.378 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 3 }
  w_bus_1oz_10c:
    expr: (I_CONTRACT / (IPC_K_EXTERNAL * 10 ** 0.44)) ** (1 / 0.725) / 1.378 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 3 }
  w_bus_2oz_20c:
    expr: (I_CONTRACT / (IPC_K_EXTERNAL * 20 ** 0.44)) ** (1 / 0.725) / 1.378 / 2 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 2 }
  w_bus_2oz_10c:
    expr: (I_CONTRACT / (IPC_K_EXTERNAL * 10 ** 0.44)) ** (1 / 0.725) / 1.378 / 2 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 3 }
  w_ch_1oz_20c:
    expr: (i_channel_worst / (IPC_K_EXTERNAL * 20 ** 0.44)) ** (1 / 0.725) / 1.378 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 2 }
  w_ch_1oz_10c:
    expr: (i_channel_worst / (IPC_K_EXTERNAL * 10 ** 0.44)) ** (1 / 0.725) / 1.378 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 3 }
  w_ch_2oz_20c:
    expr: (i_channel_worst / (IPC_K_EXTERNAL * 20 ** 0.44)) ** (1 / 0.725) / 1.378 / 2 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 2 }
  w_ch_2oz_10c:
    expr: (i_channel_worst / (IPC_K_EXTERNAL * 10 ** 0.44)) ** (1 / 0.725) / 1.378 / 2 * 0.0254e-3
    unit: m
    dim: empirical
    display: { unit: mm, digits: 2 }
  copper_2oz_um:
    expr: 2 * OZ_COPPER_UM
    unit: m
    display: { unit: um, digits: 2 }

  # ---- the UDP frame protocol -------------------------------------------

  bytes_per_module:
    expr: LEDS_PER_MODULE * BYTES_PER_LED
    unit: ""
    display: { unit: "", digits: 3 }
    uncited: true
  pixel_bytes_10:
    expr: 10 * bytes_per_module
    unit: ""
    display: { unit: "", digits: 4 }
  pixel_bytes_20:
    expr: N_MODULES * bytes_per_module
    unit: ""
    display: { unit: "", digits: 4 }
  pixel_bytes_30:
    expr: 30 * bytes_per_module
    unit: ""
    display: { unit: "", digits: 4 }
  packets_20:
    expr: ceil(pixel_bytes_20 / MTU_BYTES)
    unit: ""
    display: { unit: "", digits: 1 }
    uncited: true
  packet_rate_20:
    expr: packets_20 * FPS_TARGET
    unit: Hz
    display: { unit: pkt, digits: 3 }
  bitrate_20:
    expr: pixel_bytes_20 * 8 * FPS_TARGET
    unit: Hz
    display: { unit: MHz, digits: 3 }
  packet_occupancy:
    expr: pixel_bytes_20 / packets_20 + W5500_PACKET_INFO
    unit: ""
    display: { unit: "", digits: 4 }
  rx_free_after_packet:
    expr: W5500_RX_DEFAULT * 1024 - packet_occupancy
    unit: ""
    display: { unit: "", digits: 3 }
  spi_drain_fast:
    expr: packet_occupancy * 8 / SPI_CLOCK_FAST
    unit: s
    display: { unit: us, digits: 3 }
  spi_drain_slow:
    expr: packet_occupancy * 8 / SPI_CLOCK_SLOW
    unit: s
    display: { unit: us, digits: 3 }
  packet_gap:
    expr: (pixel_bytes_20 / packets_20 + ETH_WIRE_OVERHEAD) * 8 / LINK_RATE
    unit: s
    display: { unit: us, digits: 2 }
  rx_allocation_wrong:
    expr: W5500_RX_PIXEL + 7 * W5500_RX_DEFAULT
    unit: ""
    display: { unit: "", digits: 2 }

  # ---- the mechanical envelope ------------------------------------------

  target_area:
    expr: IPHONE_W * TARGET_H
    unit: m2
    display: { unit: mm2, digits: 4 }
  area_components:
    expr: AREA_ITEMISED + AREA_UNITEMISED
    unit: m2
    display: { unit: mm2, digits: 4 }
  area_antenna_keepout:
    expr: ANTENNA_W * ANTENNA_H
    unit: m2
    display: { unit: mm2, digits: 3 }
  area_eth_module:
    expr: ETH_MODULE_W * ETH_MODULE_H
    unit: m2
    display: { unit: mm2, digits: 3 }
  area_eth_delta:
    expr: area_eth_module - AREA_ETH_DISCRETE
    unit: m2
    display: { unit: mm2, digits: 2 }
    uncited: true
  area_tvs_change_each:
    expr: AREA_SMC - AREA_SMA
    unit: m2
    display: { unit: mm2, digits: 2 }
  area_tvs_change_total:
    expr: N_BUS_TVS * area_tvs_change_each
    unit: m2
    display: { unit: mm2, digits: 2 }
  area_led:
    expr: LED_SIDE ** 2
    unit: m2
    display: { unit: mm2, digits: 2 }
  area_leds_total:
    expr: N_STATUS_LEDS * area_led
    unit: m2
    display: { unit: mm2, digits: 2 }
  area_board_2layer:
    expr: area_components / UTILISATION_2LAYER
    unit: m2
    display: { unit: mm2, digits: 4 }
    uncited: true
  perimeter:
    expr: 2 * (BOARD_W + BOARD_H)
    unit: m
    display: { unit: mm, digits: 3 }
  edge_share:
    expr: EDGE_COMMITTED / perimeter
    unit: ""
    display: { unit: "%", digits: 2 }

  # ---- running from a USB port -------------------------------------------

  usb_share_flashing:
    expr: I_BUS_FLASHING / I_USB_LEGACY
    unit: ""
    display: { unit: "%", digits: 2 }
  usb_share_full:
    expr: I_BUS_FULL / I_USB_LEGACY
    unit: ""
    display: { unit: "%", digits: 2 }
  p_usb_for_leds:
    expr: P_USB_PORT - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 2 }
  i_usb_for_leds:
    expr: p_usb_for_leds / V_MODULE_RAIL
    unit: A
    display: { unit: A, digits: 2 }
  v_module_rail_at_1a:
    expr: V_VSAFE5V_NOM - (XL1509_VCE_A + XL1509_VCE_B * I_MODULE_HOLDS) - I_MODULE_HOLDS * R_MODULE_PATH
    unit: V
    display: { unit: V, digits: 3 }
  v_module_rail_at_1a_lo:
    expr: V_VSAFE5V_LO - (XL1509_VCE_A + XL1509_VCE_B * I_MODULE_HOLDS) - I_MODULE_HOLDS * R_MODULE_PATH
    unit: V
    display: { unit: V, digits: 3 }
  share_full_white_at_1a:
    expr: I_MODULE_HOLDS / i_module_full
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_at_1a:
    expr: share_full_white_at_1a ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  p_wall_full_bus:
    expr: p_wall_full / ETA_MODULE
    unit: W
    display: { unit: W, digits: 3 }

  # ---- what each contract buys -------------------------------------------

  p_leds_9v:
    expr: V_PDO_9 * I_CONTRACT_12V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 2 }
  p_leds_12v:
    expr: V_PDO_12 * I_CONTRACT_12V - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 2 }
  p_leds_apple96:
    expr: V_APPLE_96 * I_APPLE_96 - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 2 }
  p_leds_apple140:
    expr: V_APPLE_140 * I_APPLE_140 - P_CONTROLLER_ALLOWANCE
    unit: W
    display: { unit: W, digits: 3 }
  perceived_9v:
    expr: min(CAP_THERMAL, p_leds_9v * ETA_MODULE / p_wall_full) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_12v:
    expr: min(CAP_THERMAL, p_leds_12v * ETA_MODULE / p_wall_full) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_apple96:
    expr: min(CAP_THERMAL, p_leds_apple96 * ETA_MODULE / p_wall_full) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  perceived_apple140:
    expr: min(CAP_THERMAL, p_leds_apple140 * ETA_MODULE / p_wall_full) ** (1 / GAMMA)
    unit: ""
    display: { unit: "%", digits: 2 }
  apple96_power_share:
    expr: p_leds_apple96 / p_modules
    unit: ""
    display: { unit: "%", digits: 2 }

  p_clamp_branch:
    expr: p_r44_nominal + p_zener
    unit: W
    display: { unit: mW, digits: 1 }
  p_clamp_branch_vendor_step:
    expr: v_across_r44_nominal ** 2 / R44_VENDOR_STEP + V_ZENER_NOM * v_across_r44_nominal / R44_VENDOR_STEP
    unit: W
    display: { unit: mW, digits: 2 }
  t_holdup_with_leds:
    expr: C_HOLDUP_PROPOSED * (V_BUS - V_MODULE_RAIL) / I_CONTRACT
    unit: s
    display: { unit: ms, digits: 2 }
  v_module_rail_saturated:
    expr: V_VSAFE5V_LO - XL1509_VSAT_MAX
    unit: V
    display: { unit: V, digits: 3 }
  n_gpio_used:
    expr: 4 + 2 + 2 + 2 + 1 + N_CHANNELS + N_CHANNELS + 1 + 1 + 2 + 1
    unit: ""
    display: { unit: "", digits: 2 }

